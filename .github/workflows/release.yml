name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches gradle.properties
        run: |
          GRADLE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version '${TAG_VERSION}' does not match gradle.properties version '${GRADLE_VERSION}'. Update gradle.properties before tagging."
            exit 1
          fi

      - name: Run tests
        run: ./gradlew clean test

      - name: Build jar
        run: ./gradlew build

      - name: Prepare release notes
        run: ./gradlew writeReleaseNotes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          name: ClickSorted ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: build/libs/ClickSorted-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true

      - name: Publish to Modrinth
        id: modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth

      - name: Publish to Hangar
        id: hangar
        if: always()
        continue-on-error: true
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew publishPluginPublicationToHangar syncPluginPublicationMainResourcePagePageToHangar

      - name: Check publish results
        if: always()
        run: |
          if [ "${{ steps.modrinth.outcome }}" != "success" ]; then
            echo "::error::Publish to Modrinth failed."
          fi
          if [ "${{ steps.hangar.outcome }}" != "success" ]; then
            echo "::error::Publish to Hangar failed."
          fi
          if [ "${{ steps.modrinth.outcome }}" != "success" ] || [ "${{ steps.hangar.outcome }}" != "success" ]; then
            exit 1
          fi
