# See https://github.com/kccricket/clicksort
enable_metrics: true
check_for_updates: true
check_for_updates_interval_hours: 24
debug_level: 'OFF'
drop_excess: true
default_group_name: '000-default'
ignore_plugin_inventory: false
default_locale: en_us
defaults:
  enabled: true
  click_mode: SWAP
  sort_mode: NAME
  start_corner: TOP_LEFT
  fill_axis: HORIZONTAL
  sort_over_items: false
  bundle_in_inventory: false
  bundle_in_containers: false
  bundle_stack_limit: 12
locked_slots:
  player: []
action_cooldown_ms: 150

# Master switch for /clicksorted admin benchmark, an in-situ sort/repack timing test — it runs
# synchronously on the main thread and briefly pauses the server. Requires
# clicksorted.admin.commands.benchmark as well. Leave this false on production servers.
enable_benchmark: false
sortable_inventories:
  - "PLAYER"
  - "CHEST"
  - "CHEST_MINECART"
  - "ENDER_CHEST"
  - "SHULKER_BOX"
  - "BARREL"
  - "HOPPER"
  - "HOPPER_MINECART"
  - "DROPPER"
  - "DISPENSER"
blacklist:
  materials: []
  names: []
