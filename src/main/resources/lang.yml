# ClickSorted language file
#
# All values are rendered with MiniMessage (https://docs.advntr.dev/minimessage).
# You may use color/formatting tags such as <white>, <red>, <bold>, etc.
# Edits take effect after running /clicksorted reload.
#
# Placeholder tags are listed in comments above each message that accepts one.
# Do not remove a placeholder from a message that requires it.

# Prepended to every status/error/alert message sent to players. MiniMessage. Set to "" to disable.
prefix: "<gray>[<aqua>ClickSorted<gray>] "

# Command feedback — sort mode
# Placeholder: <method>
setSortingMethodTo: "Your <aqua>sort mode<white> is now set to: <aqua><method><white>."
# Placeholder: <method>
sortingMethodNotAvailable: "Sort mode <method> is not available — configure groups.yml first."

# Command feedback — click mode
# Placeholders: <method>, <instruction>
setClickMethodTo: "Your <aqua>click mode<white> is now set to: <aqua><method><white>. <instruction>"

# Command feedback — sort layout (/clicksorted set start-corner|fill-axis)
# Placeholder: <corner>
setStartCornerTo: "Your <aqua>sort start corner<white> is now set to: <aqua><corner><white>."
# Placeholder: <axis>
setFillAxisTo: "Your <aqua>sort fill direction<white> is now set to: <aqua><axis><white>."

# Command feedback — sort-over-items toggle (/clicksorted hover)
# Placeholder: <status> (ENABLED or DISABLED)
setSortOverItemsStatus: "Sorting while hovering over an item is now <aqua><status><white> for you."
# Shown when a click method governs hover and forces it to a value.
# Placeholders: <status> (ENABLED or DISABLED), <method>
hoverForcedByClickMethod: "Sorting while hovering over an item is now <aqua><status><white> for you because your click mode is <aqua><method><white>."
# Shown when the player tries to change hover but their click method controls it.
# Placeholder: <method>
hoverGovernedByClickMethod: "Sorting while hovering over an item is restricted by your click mode (<aqua><method><white>) and can't be changed."

# Shown (to the player) at join when a stored preference held an invalid value and was reset.
# Placeholders: <pref>, <value>, <default>
prefResetInvalid: "Your saved <aqua><pref><white> value, <aqua><value><white>, was invalid and has been reset to <aqua><default><white>."

# Shown when a /clicksorted set … argument can't be parsed.
# Placeholders: <value> (what the player typed), <valid> (comma-joined valid options)
invalidValue: "<red>Invalid value '<value>'. Valid values: <valid>."

# Command feedback — bundle packing toggles (/clicksorted bundle inventory|others on|off)
# Placeholder: <status> (ENABLED or DISABLED)
setBundlePackInventoryStatus: "Bundle packing in your inventory is now <aqua><status><white>."
setBundlePackOthersStatus: "Bundle packing in other containers is now <aqua><status><white>."

# Command feedback — bundle stack limit (/clicksorted bundle stacklimit <n|off>)
# Placeholder: <limit> (max distinct entries per bundle, or "off" for weight-only)
setBundleStackLimitStatus: "Your <aqua>bundle stack limit<white> is now <aqua><limit><white>."

# Command feedback — bundle blacklist (/clicksorted set bundle blacklist add|remove|list|clear)
# Placeholder: <material> (material name)
setBundleBlacklistAdded: "<aqua><material><white> added to your bundle blacklist."
setBundleBlacklistAlreadyPresent: "<aqua><material><white> is already in your bundle blacklist."
setBundleBlacklistRemoved: "<aqua><material><white> removed from your bundle blacklist."
setBundleBlacklistNotPresent: "<aqua><material><white> is not in your bundle blacklist."
# Placeholder: <list> (comma-separated material names)
setBundleBlacklistMaterialsList: "Blacklisted materials: <aqua><list><white>."
setBundleBlacklistEmpty: "Your bundle blacklist is <aqua>empty<white>."
setBundleBlacklistCleared: "Your bundle blacklist has been <aqua>cleared<white>."
# Command feedback — bundle blacklist name sub-branch (/clicksorted set bundle blacklist name ...)
# Placeholder: <name> (plain-text display name)
setBundleBlacklistNameAdded: "Display name <aqua><name><white> added to your bundle blacklist."
setBundleBlacklistNameAlreadyPresent: "Display name <aqua><name><white> is already in your bundle blacklist."
setBundleBlacklistNameRemoved: "Display name <aqua><name><white> removed from your bundle blacklist."
setBundleBlacklistNameNotPresent: "Display name <aqua><name><white> is not in your bundle blacklist."
# Placeholder: <list> (comma-separated display names)
setBundleBlacklistNamesList: "Blacklisted display names: <aqua><list><white>."

# Blacklist GUI (/clicksorted set bundle blacklist with no further arguments)
blacklistGuiTitle: "<!italic>Bundle Blacklist"
# Lore shown on every blacklist entry (both material and name entries).
blacklistEntryLore: "<!italic><gray>Click to remove."
# Display name for the black-pane filler slots in the control row.
blacklistFillerName: "<!italic><dark_gray> "
# Help book in the centre of the control row.
blacklistHelpBookName: "<!italic>Bundle Blacklist"
blacklistHelpBookLore: "<!italic><gray>Click an item in your inventory to add it to<newline>the blacklist. Click a listed entry to remove it."
# Pagination arrow controls.
blacklistArrowPrev: "<!italic>Previous page"
blacklistArrowNext: "<!italic>Next page"

# Command feedback — status (/clicksorted status)
# Placeholder: <method>
statusClickMethod: "Click method: <method>"
# Placeholder: <method>
statusSortMethod: "Sort method: <method>"
# Placeholder: <corner>
statusStartCorner: "Start corner: <corner>"
# Placeholder: <axis>
statusFillAxis: "Fill direction: <axis>"
# Placeholder: <status> (ENABLED or DISABLED)
statusHover: "Sort over items: <status>"

# Command feedback — debug level
# Placeholder: <level>
setDebugLevelTo: "Debug level is now temporarily set to <aqua><level><white>."
# Placeholder: <level>
invalidDebugLevel: "Invalid debug level '<level>'. Valid values: OFF, DEBUG, TRACE."

# Command feedback — reload
configReloaded: "Configuration reloaded."

# Inventory overflow messages
invOverFlow: "Inventory overflow — items were not sorted."
dropItems: "Some items couldn't fit and were dropped!"

# Sort-trigger instructions (shown as part of the sortBy message via <instruction>)
instructionSingle: "Left-click an empty slot to sort."
instructionDouble: "Double-click any slot to sort."
instructionSwap: "Press the offhand-swap key to sort."
instructionControlDrop: "Press Ctrl+Q (drop key) over a slot to sort."
instructionShiftLeftClick: "Shift-left-click a slot to sort."
instructionShiftRightClick: "Shift-right-click a slot to sort."
instructionDisabled: "Click-sorting has been disabled."

# Error shown when a player-only command is run from the console
notFromConsole: "This command can only be used by a player."

# Shown (rate-limited) when a player triggers actions faster than action_cooldown_ms allows
actionTooFast: "<red>Slow down — you're acting too quickly."

# Lock GUI
lockGuiTitle: "<!italic>Inventory Sorting Locks"
lockPaneUnlocked: "<!italic><green>Unlocked"
lockPaneLocked: "<!italic><red>Locked"
# Placeholder: <number>
lockPaneSlotInventory: "<!italic><gray>Inventory slot <number>"
# Placeholder: <number>
lockPaneSlotHotbar: "<!italic><gray>Hotbar slot <number>"
lockPaneUnlockedLore: "<!italic><gray>Click to lock this slot."
lockPaneLockedLore: "<!italic><gray>Click to unlock this slot."
lockPaneUnsortable: "<!italic><dark_gray>Not sortable"
lockPaneUnsortableLore: "<!italic><gray>This slot is always excluded from sorting."
lockDividerName: "<!italic><dark_gray>--------"
lockHelpHeadName: "<!italic>What is this?"
lockHelpHeadLore: "<!italic><gray>Locked inventory slots will not be sorted and<newline>bundles in a locked slot will not be packed."
