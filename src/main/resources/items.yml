# ClickSorted item display-name store.
#
# Optional overrides for how materials are labeled under the NAME sort mode.
# Add entries of the form:
#
#   MATERIAL_NAME: "Display Name"
#
# The MATERIAL_NAME keys are Bukkit Material enum names (e.g. STONE, DIAMOND_SWORD).
# Any material not listed here is labeled by its Material name as-is. Items a player
# or plugin has renamed always use that custom name and ignore this file.
