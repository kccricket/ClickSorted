setBundlePackEnabledStatus: "Bundle packing is now <aqua><status><white> for you (inventory and containers)."
setBundlePackInInventoryStatus: "Bundle packing in your inventory is now <aqua><status><white>."
setBundlePackInContainersStatus: "Bundle packing in other containers is now <aqua><status><white>."

# Command feedback — bundle stack limit (/clicksorted bundle stack-limit <n|off>)
