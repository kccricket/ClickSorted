# ClickSorted built-in English (en_us) language defaults.
#
# This file ships inside the plugin jar and is the internal source of truth for every message —
# it is NOT the file admins are meant to edit. It updates automatically with the plugin, so a
# changed default here reaches every server on the next release with no admin action required.
#
# To override specific messages (or add a translation), edit
# plugins/ClickSorted/lang/<locale>.yml instead (e.g. lang/en_us.yml, lang/de_de.yml). That file
# is sparse: only the keys present there override the built-in default below, and everything else
# still tracks future plugin updates. See docs/admin/lang.md for the full resolution order and
# lowercase Minecraft-locale filename convention.
#
# All values are rendered with MiniMessage (https://docs.advntr.dev/minimessage).
# You may use color/formatting tags such as <white>, <red>, <bold>, etc.
# Edits take effect after running /clicksorted reload.
#
# Placeholder tags are listed in comments above each message that accepts one.
# Do not remove a placeholder from a message that requires it.

# Prepended to every status/error/alert message sent to players. MiniMessage. Set to "" to disable.
prefix: "<gray>[<aqua>ClickSorted<gray>] "

# Command feedback — enabled toggle (/clicksorted set enabled, bare /clicksorted)
# Placeholder: <status> (ENABLED or DISABLED)
setEnabledStatus: "Click-sorting is now <aqua><status><white> for you."

# Command feedback — sort mode
# Placeholder: <method>
setSortingMethodTo: "Your <aqua>sort mode<white> is now set to: <aqua><method><white>."
# Placeholder: <method>
sortingMethodNotAvailable: "Sort mode <method> is not available — configure groups.yml first."

# Command feedback — click mode
# Placeholders: <method>, <instruction>
setClickMethodTo: "Your <aqua>click mode<white> is now set to: <aqua><method><white>. <instruction>"

# Command feedback — sort layout (/clicksorted set start-corner|fill-axis)
# Placeholder: <corner>
setStartCornerTo: "Your <aqua>sort start corner<white> is now set to: <aqua><corner><white>."
# Placeholder: <axis>
setFillAxisTo: "Your <aqua>sort fill direction<white> is now set to: <aqua><axis><white>."

# Command feedback — sort-over-items toggle (/clicksorted hover)
# Placeholder: <status> (ENABLED or DISABLED)
setSortOverItemsStatus: "Sorting while hovering over an item is now <aqua><status><white> for you."
# Shown when a click method governs hover and forces it to a value.
# Placeholders: <status> (ENABLED or DISABLED), <method>
hoverForcedByClickMethod: "Sorting while hovering over an item is now <aqua><status><white> for you because your click mode is <aqua><method><white>."
# Shown when the player tries to change hover but their click method controls it.
# Placeholder: <method>
hoverGovernedByClickMethod: "Sorting while hovering over an item is restricted by your click mode (<aqua><method><white>) and can't be changed."

# Shown (to the player) at join when a stored preference held an invalid value and was reset.
# Placeholders: <pref>, <value>, <default>
prefResetInvalid: "Your saved <aqua><pref><white> value, <aqua><value><white>, was invalid and has been reset to <aqua><default><white>."

# Shown (to admins with clicksorted.admin.notify.update-available) at join when a newer release exists.
# Placeholders: <version> (latest release), <current> (version you are running)
# The download link always points to the Modrinth page and is not a placeholder.
updateAvailableNotify: "A new version of ClickSorted is available: <aqua><version><white> (you are running <aqua><current><white>). <click:open_url:'https://modrinth.com/plugin/clicksorted'><hover:show_text:'Open the download page'><aqua>[Download]</aqua></hover></click>"

# Shown when a /clicksorted set … argument can't be parsed.
# Placeholders: <value> (what the player typed), <valid> (comma-joined valid options)
invalidValue: "<red>Invalid value '<value>'. Valid values: <valid>."

# Generic fallback shown when a PlayerPreferenceChangeEvent listener cancels a preference change
# without giving a reason (a listener-supplied reason is shown verbatim instead of this).
preferenceChangeBlocked: "That change was blocked."

# Command feedback — bundle packing toggles (/clicksorted bundle in-inventory|in-containers yes|no)
