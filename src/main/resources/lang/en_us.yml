# Sort-trigger instructions (shown as part of the sortBy message via <instruction>, and reused
# verbatim by the self-test LIVE phase's action-bar prompts — kept plain text, no MiniMessage tags,
# so they compose cleanly inside another rendered template).
#
# SINGLE_CLICK and CONTROL_DROP each force a specific allow-on-hover setting (see
# ClickMethod.requiredSortOverItems), so they have one key apiece. The other four methods leave
# hover to the player's own preference, so each has a plain key (hover off — the default — sorts an
# empty slot only) and a "…Hover" key (hover on — sorts any slot); ClickMethod.getInstruction picks
# between them based on the player's actual setting, so the text shown always matches what will
# really sort.
instructionSingle: "Left-click an empty slot (with nothing on your cursor) to sort."
instructionControlDrop: "Press Ctrl+Q (drop key) over an occupied slot to sort."
instructionSwap: "Press the offhand-swap key (default F) over an empty slot to sort."
instructionSwapHover: "Press the offhand-swap key (default F) over any slot to sort."
instructionDouble: "Double-click an empty slot to sort."
instructionDoubleHover: "Double-click any slot to sort."
instructionShiftLeftClick: "Shift-left-click an empty slot to sort."
instructionShiftLeftClickHover: "Shift-left-click any slot to sort."
instructionShiftRightClick: "Shift-right-click an empty slot to sort."
instructionShiftRightClickHover: "Shift-right-click any slot to sort."

