name: ClickSorted
main: net.kccricket.clicksorted.ClickSortedPlugin
authors: [ kccricket, desht, chengzi ]
version: ${project.version}
description: Super-convenient inventory sorting
website: https://github.com/kccricket/ClickSorted
api-version: 1.21.5
folia-supported: true

permissions:
  clicksorted.admin:
    description: Full admin control for ClickSorted
    default: op
    children:
      clicksorted.commands.reload: true
      clicksorted.commands.enabled: true
      clicksorted.commands.sort: true
      clicksorted.commands.click: true
      clicksorted.commands.hover: true
      clicksorted.commands.lock: true
      clicksorted.commands.bundle: true
      clicksorted.commands.status: true
      clicksorted.commands.getcfg: true
      clicksorted.commands.debug: true
      clicksorted.commands.benchmark: true
      clicksorted.throttle.bypass: true
  clicksorted.commands.enabled:
    description: Allow toggling click-sorting on/off (/clicksorted sort enabled, bare /clicksorted)
    default: true
  clicksorted.commands.reload:
    description: Allow use of the /clicksorted admin reload command
    default: op
  clicksorted.commands.getcfg:
    description: Allow use of the /clicksorted admin config command
    default: op
  clicksorted.commands.debug:
    description: Allow use of the /clicksorted admin debug command
    default: op
  clicksorted.commands.benchmark:
    description: Allow use of the /clicksorted admin benchmark command
    default: op
  clicksorted.throttle.bypass:
    description: Exempt from the per-player action throttle (action_cooldown_ms)
    default: op
  clicksorted.commands.sort:
    description: Allow use of the /clicksorted sort subcommands
    default: true
  clicksorted.commands.click:
    description: Allow use of the /clicksorted click method command
    default: true
  clicksorted.commands.hover:
    description: Allow use of the /clicksorted click allow-on-hover command
    default: true
  clicksorted.commands.lock:
    description: Allow use of the /clicksorted lock-slots command
    default: true
  clicksorted.commands.bundle:
    description: Allow use of the /clicksorted bundle subcommands
    default: true
  clicksorted.commands.status:
    description: Allow use of the /clicksorted status command
    default: true
  clicksorted.sort:
    description: Allow all kinds of inventories to be click-sorted
    default: true
    children:
      clicksorted.sort.hotbar: true
      clicksorted.sort.player: true
      clicksorted.sort.container: true
  clicksorted.sort.hotbar:
    description: Allow hotbar to be click-sorted
    default: true
  clicksorted.sort.player:
    description: Allow player inventory (excluding hotbar) to be click-sorted
    default: true
  clicksorted.sort.container:
    description: Allow container to be click-sorted
    default: true
