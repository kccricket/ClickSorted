name: ClickSorted
main: net.kccricket.clicksorted.ClickSortedPlugin
authors: [ kccricket, desht, chengzi ]
version: ${project.version}
description: Super-convenient inventory sorting
website: https://github.com/kccricket/ClickSorted
api-version: 1.20.6
folia-supported: true

permissions:
  clicksorted:
    description: >-
      Master kill-switch for all player-facing ClickSorted features: click-triggered sorting,
      bundle packing, and player commands. Denying this node disables all of the above for that
      player in one move. Does not affect admin access (clicksorted.admin.commands.*).
    default: true
  clicksorted.admin:
    description: Full admin control for ClickSorted (grants all command, sort, and bundle nodes)
    default: op
    children:
      clicksorted.commands: true
      clicksorted.admin.commands: true
      clicksorted.sort: true
      clicksorted.bundle: true
      clicksorted.throttle.bypass: true
  clicksorted.commands:
    description: Access to the /clicksorted command tree (umbrella; gates the root literal)
    default: true
    children:
      clicksorted.commands.sort: true
      clicksorted.commands.click: true
      clicksorted.commands.bundle: true
      clicksorted.commands.lock: true
      clicksorted.commands.status: true
      clicksorted.commands.menu: true
  clicksorted.commands.sort:
    description: Access to /clicksorted sort subcommands
    default: true
    children:
      clicksorted.commands.sort.enabled: true
      clicksorted.commands.sort.method: true
      clicksorted.commands.sort.start-corner: true
      clicksorted.commands.sort.fill-axis: true
  clicksorted.commands.sort.enabled:
    description: Allow toggling click-sorting on/off (/clicksorted and /clicksorted sort enabled)
    default: true
  clicksorted.commands.sort.method:
    description: Allow use of /clicksorted sort method
    default: true
  clicksorted.commands.sort.start-corner:
    description: Allow use of /clicksorted sort start-corner
    default: true
  clicksorted.commands.sort.fill-axis:
    description: Allow use of /clicksorted sort fill-axis
    default: true
  clicksorted.commands.click:
    description: Access to /clicksorted click subcommands
    default: true
    children:
      clicksorted.commands.click.method: true
      clicksorted.commands.click.hover: true
  clicksorted.commands.click.method:
    description: Allow use of /clicksorted click method
    default: true
  clicksorted.commands.click.hover:
    description: Allow use of /clicksorted click allow-on-hover
    default: true
  clicksorted.commands.bundle:
    description: Allow use of /clicksorted bundle subcommands
    default: true
  clicksorted.commands.lock:
    description: Allow use of /clicksorted lock-slots
    default: true
  clicksorted.commands.status:
    description: Allow use of /clicksorted status
    default: true
  clicksorted.commands.menu:
    description: Allow use of /clicksorted menu (the dialog-based preferences UI)
    default: true
  clicksorted.admin.commands:
    description: Access to /clicksorted admin subcommands
    default: op
    children:
      clicksorted.admin.commands.reload: true
      clicksorted.admin.commands.config: true
      clicksorted.admin.commands.debug: true
      clicksorted.admin.commands.benchmark: true
      clicksorted.admin.commands.selftest: true
  clicksorted.admin.commands.reload:
    description: Allow use of /clicksorted admin reload
    default: op
  clicksorted.admin.commands.config:
    description: Allow use of /clicksorted admin config
    default: op
  clicksorted.admin.commands.debug:
    description: Allow use of /clicksorted admin debug
    default: op
  clicksorted.admin.commands.benchmark:
    description: Allow use of /clicksorted admin benchmark
    default: op
  clicksorted.admin.commands.selftest:
    description: Allow use of /clicksorted admin selftest
    default: op
  clicksorted.throttle.bypass:
    description: Exempt from the per-player action throttle (action_cooldown_ms)
    default: op
  clicksorted.sort:
    description: Allow all kinds of inventories to be click-sorted
    default: true
    children:
      clicksorted.sort.hotbar: true
      clicksorted.sort.player: true
      clicksorted.sort.container: true
  clicksorted.sort.hotbar:
    description: Allow hotbar to be click-sorted
    default: true
  clicksorted.sort.player:
    description: Allow player inventory (excluding hotbar) to be click-sorted
    default: true
  clicksorted.sort.container:
    description: Allow container to be click-sorted
    default: true
  clicksorted.bundle:
    description: Allow bundle packing during a sort (both inventory and containers)
    default: true
    children:
      clicksorted.bundle.inventory: true
      clicksorted.bundle.container: true
  clicksorted.bundle.inventory:
    description: Allow bundle packing in the player's main inventory during a sort
    default: true
  clicksorted.bundle.container:
    description: Allow bundle packing in containers during a sort
    default: true
