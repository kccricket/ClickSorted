# Test-only config — keeps tests hermetic and fast.
# Disables bStats network activity.
enable_metrics: false
debug_level: OFF
drop_excess: true
default_group_name: '000-default'
ignore_plugin_inventory: false
defaults:
  click_mode: SWAP
  sort_mode: NAME
  shift_click: true
  bundle_cap: true
bundle_entry_cap: 12
player_sort_min: 9
player_sort_max: 36
sortable_inventories:
  - "PLAYER"
  - "CHEST"
  - "ENDER_CHEST"
  - "SHULKER_BOX"
  - "BARREL"
