# Test-only config — keeps tests hermetic and fast.
# Disables bStats network activity.
enable_metrics: false
debug_level: OFF
drop_excess: true
default_group_name: '000-default'
ignore_plugin_inventory: false
defaults:
  click_mode: SWAP
  sort_mode: NAME
  # Tests exercise sorting over occupied slots, so enable this by default here
  # (production config.yml ships with sort_over_items: false).
  sort_over_items: true
  bundle_in_inventory: false
  bundle_in_containers: false
  bundle_stack_limit: 12
locked_slots:
  player: []
# Throttling disabled by default in tests; throttle tests set this explicitly.
action_cooldown_ms: 0
sortable_inventories:
  - "PLAYER"
  - "CHEST"
  - "ENDER_CHEST"
  - "SHULKER_BOX"
  - "BARREL"
